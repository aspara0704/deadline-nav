name: Verify release
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --check app.js
      - run: node --check toll-core.js
      - run: node --test tests/toll-core.test.cjs
      - run: python tools/package-release.py
      - uses: actions/upload-artifact@v4
        with:
          name: deadline-nav-local-ic
          path: dist/*.zip
