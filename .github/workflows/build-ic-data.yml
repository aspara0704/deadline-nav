name: Build bundled IC catalog

on:
  push:
    branches: [main]
    paths:
      - 'tools/build-ic-data.py'
      - 'tools/ic-supplement.json'
      - 'ic-data.min.json'
      - '.github/workflows/build-ic-data.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download source dataset
        run: |
          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/yH3PO4/HighwayOrderedDS/523b06097594e58d2004928b032951f69bd45398/data/N06_Joint_fixed.geojson' \
            --output /tmp/N06_Joint_fixed.geojson
      - name: Build compact local catalog
        run: python3 tools/build-ic-data.py /tmp/N06_Joint_fixed.geojson ic-data.min.json
      - name: Verify catalog
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('ic-data.min.json',encoding='utf-8'))
          items=d.get('items',[])
          assert d.get('meta',{}).get('complete') is True
          assert len(items) >= 300, len(items)
          assert all(isinstance(x.get('name'),str) and x.get('name') for x in items)
          assert all(isinstance(x.get('lat'),(int,float)) and isinstance(x.get('lng'),(int,float)) for x in items)
          print('catalog entries:', len(items))
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify local discovery
        run: node --test tests/local-ic.test.cjs
      - name: Commit generated catalog
        run: |
          if git diff --quiet -- ic-data.min.json; then
            echo 'IC catalog already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ic-data.min.json
          git commit -m 'Build bundled nationwide IC catalog'
          git push

